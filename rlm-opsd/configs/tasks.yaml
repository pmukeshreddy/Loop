# M2 operational defaults. These are not teacher-gate / OPSD-exit thresholds.
seed: 417
workers: 2
size_buckets: [8192, 32768, 131072, 524288, 2097152, 8388608]
structures: [str, list]
# Rotate encodings evenly through eligible cells; repo files use Markdown.
encodings: [plain, jsonl, csv, logs, markdown]
families:
  sparse_retrieval: 1
  multi_hop: 1
  linear_aggregation: 1
  quadratic_pairs: 1
  repo_qa: 1
  small_context_control: 3
splits:
  train: 5
  dev_behavior: 1
direct_read_max_chars: 16384
# Knobs are sampled independently for each task from its derived seed.
# min/max are inclusive; quote ISO dates to keep them strings in YAML.
family_knobs:
  sparse_retrieval:
    needles: {min: 1, max: 8}
  multi_hop:
    hops: {min: 2, max: 4}
  linear_aggregation:
    label_count: {min: 2, max: 8}
    temporal_filter: {choices: [true, false]}
    cutoff_date: {min: '2023-01-01', max: '2023-06-28'}
  quadratic_pairs:
    users: 24
    label_count: {min: 2, max: 8}
    temporal_filter: {choices: [true, false]}
    cutoff_date: {min: '2023-01-01', max: '2023-06-28'}
    pair_relation: {choices: [both_have_any, cover_labels]}
  repo_qa:
    files: {min: 8, max: 64}
  small_context_control:
    records: {min: 4, max: 24}
decontamination:
  ngram_size: 5
  overlap_threshold: 0.8
classification_sources:
  train:
    path: .deps/m2-sources/banking-train.csv
    url: https://raw.githubusercontent.com/PolyAI-LDN/task-specific-datasets/57ec275d8078af65b7731c2a98be812d844a6d6b/banking_data/train.csv
    sha256: b06e26ac675513959a63135f11b94ea7786ed02da65db93a5650d8838cbc664b
    revision: 57ec275d8078af65b7731c2a98be812d844a6d6b
    partition: train
    ambiguity_policy: drop
  dev_behavior:
    path: .deps/m2-sources/banking-test.csv
    url: https://raw.githubusercontent.com/PolyAI-LDN/task-specific-datasets/57ec275d8078af65b7731c2a98be812d844a6d6b/banking_data/test.csv
    sha256: d12d6e3bc4c3103966ae786dc435913c0c563dfa328f5a3646d0e62cfeeb474d
    revision: 57ec275d8078af65b7731c2a98be812d844a6d6b
    partition: test
    ambiguity_policy: drop
heldout_index: .deps/m2-sources/heldout-index.json
# Real public queries, useful for partial checking. No source contexts are in
# this artifact, so it MUST NOT certify complete heldout coverage.
heldout_question_sources:
  - benchmark: oolong_pairs
    path: .deps/m2-sources/pairs-questions.json
    url: https://huggingface.co/datasets/mit-oasys/oolong-pairs/resolve/d1e1522b86ac0c169bbc890b0471408aaa29e8fa/questions.json
    sha256: 9d147c25ce727d09d35470ef267db59b3877132429b8b0269a46d941f252cada
    revision: d1e1522b86ac0c169bbc890b0471408aaa29e8fa
    license: MIT
# Optional verified raw JSON/JSONL snapshots; see TASK_PIPELINE.md. Missing
# snapshots are reported, and the training loader refuses incomplete coverage.
heldout_snapshots: []

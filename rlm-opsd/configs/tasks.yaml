     commit: 15206881c006c79667fe5154fe80c01c65410679, license: BSD-3-Clause,
     pythonpath: [src], test_paths: [tests], test_deps: [pytest, trio]}
  - {name: marshmallow-code/marshmallow, url: https://github.com/marshmallow-code/marshmallow.git, ref: 4.3.1,
     commit: c7b559a1fa3aba57ca6dba0ab336841c5038a782, license: MIT,
     pythonpath: [src], test_paths: [tests], test_deps: [pytest, simplejson]}
  - {name: jd/tenacity, url: https://github.com/jd/tenacity.git, ref: 9.2.1,
     commit: 4410996dd9a96864a2733ce0778bcaa112b72811, license: Apache-2.0,

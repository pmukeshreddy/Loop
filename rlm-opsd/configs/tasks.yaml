# AgentInstruct-style DeepSWE task generation for the OPSD phase.
# Values here are operational/data-filter settings. They are not teacher-gate
# or OPSD-exit thresholds (configs/gate.yaml, configs/exit.yaml).
seed: 417
sources_dir: .deps/task-sources        # pinned clones, exported trees, per-repo venvs
work_dir: .deps/task-generation        # resumable candidate state, rejection log, usage
python: '3.12'
harness_config: configs/harness.yaml   # the solver runs inside the student's harness limits
# Reference executions only: timing limits absorb remote-API sub-call latency
# (training sub-calls hit a local server). Turn, sub-call count/size, memory and
# CPU limits stay exactly the student's.
solver_harness_overrides:
  subcall_timeout_s: 180
  sandbox: {wall_time_s: 900}

models:
  auth: chatgpt                        # step1.auth: chatgpt (OAuth plan) or api-key
  model: gpt-6.1-sol
  request_timeout_s: 600
  effort:                              # reasoning effort per role
    source_analysis: high
    question_generation: high
    variation_suggester: medium
    variation_editor: high
    oracle: high
    review: medium
    baseline: low
    solver_root: medium
    solver_subcall: low

targets:                               # accepted tasks after verification and review
  train: 200
  dev_behavior: 40

splits:
  # Repositories are assigned before generation, stratified by size, so a task
  # and all of its variations share a repository and therefore a split.
  dev_behavior_repositories: 4

generation:
  seeds_per_round: 6
  max_rounds_per_repo: 8
  variations_per_seed: 2
  concurrency: 18                      # candidates processed in parallel
  test_concurrency: 6                  # concurrent repository test processes
  stability_runs: 3                    # failing/passing evidence must hold on every run
  solver_attempts: 2                   # reference solves per candidate before rejection
  test_timeout_s: 900
  oracle_timeout_s: 120
  analysis_source_chars: 260000        # source text shown to the analyst per repository
  generator_file_chars: 160000         # file text shown with each generation request

context:
  max_chars: 1200000
  max_documents: 450
  max_file_chars: 150000
  direct_read_max_chars: 16384         # direct_solve tasks must stay below this
  size_buckets: [16384, 65536, 262144, 1048576, 4194304]
  exclude:                             # never placed in task contexts
    - .git/**
    - .github/**
    - '**/AGENTS.md'
    - '**/CLAUDE.md'
    - '**/*.lock'
    - '**/uv.lock'
    - '**/*.png'
    - '**/*.svg'
    - '**/*.ico'
    - '**/*.jpg'
    - '**/*.gif'
    - '**/*.pdf'

filters:
  max_setup_fail_fraction: 0.25        # a defect may not break most of the suite
  max_impact_tests: 30                 # change-impact answers stay reviewable
  min_impact_tests: 1
  question_ngram_size: 5
  max_question_similarity: 0.55        # within-repository near-duplicate questions
  max_question_chars: 2500
  max_question_code_lines: 12          # longer embedded listings read as quizzes, not requests

practice:
  # Thresholds used only to check that a reference execution exhibits the
  # intended RLM behavior. Detector gate/exit thresholds stay user-owned.
  large_context_min_chars: 65536
  probe_max_chars: 3000
  dump_threshold: 6000
  read_threshold: 6000
  many_hits: 60
  subcall_max_chars: 32000
  min_batch_chars: 0
  hand_copy_min_chars: 120
  dense_coverage_min: 0.5
  min_turns_persistent_state: 3
  min_subcalls_decomposition: 2

heldout:
  index: .deps/task-sources/heldout-index.json
  deepswe_manifest: ../data/deep-swe/tasks/manifest.json
  deepswe_tasks_dir: ../data/deep-swe/tasks
  decontamination:
    ngram_size: 5
    overlap_threshold: 0.6
  # Real public queries, useful for partial checking. No source contexts are in
  # this artifact, so it MUST NOT certify complete heldout coverage.
  question_sources:
    - benchmark: oolong_pairs
      path: .deps/m2-sources/pairs-questions.json
      url: https://huggingface.co/datasets/mit-oasys/oolong-pairs/resolve/d1e1522b86ac0c169bbc890b0471408aaa29e8fa/questions.json
      sha256: 9d147c25ce727d09d35470ef267db59b3877132429b8b0269a46d941f252cada
      revision: d1e1522b86ac0c169bbc890b0471408aaa29e8fa
      license: MIT
  # Optional verified raw JSON/JSONL snapshots; see TASK_PIPELINE.md. Missing
  # snapshots are reported, and the training loader refuses incomplete coverage.
  snapshots: []

# Permissive Python repositories, none of them a DeepSWE-113 upstream.
# pythonpath entries are relative to the task checkout and shadow the
# installed distribution, so tests and oracles exercise the edited tree.
# Packages that pytest itself imports (pluggy, packaging, iniconfig) are
# unsuitable: a defect in the checkout would break the test runner. Suites
# that must run under unittest rather than pytest are excluded as well.
repositories:
  - {name: pallets/click, url: https://github.com/pallets/click.git, ref: 8.5.0,
     commit: 8b19813f2bfca99f1018a587a8cf54fc959f2e5d, license: BSD-3-Clause,
     pythonpath: [src], test_paths: [tests], test_deps: [pytest]}

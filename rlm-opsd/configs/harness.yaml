# Operational defaults, not teacher-gate or OPSD-exit thresholds.
max_turns: 20
# Includes reasoning tokens; adjust alongside the server's context window.
max_tokens_per_turn: 4096
max_subcalls: 32
max_subcall_chars: 32000
subcall_chunk_chars: 16000
subcall_concurrency: 4
subcall_timeout_s: 60
subcall_max_tokens: 4096
prefix_chars: 0
stdout_max_chars: 20000
enable_recursion: false
max_depth: 1
sandbox:
  wall_time_s: 120       # per execute/variable-resolution request, includes subcalls
  memory_mb: 1024       # total resident memory of worker and its live descendants
  cpu_time_s: 30        # cumulative user + system CPU since worker initialization

[project]
name = "rlm-opsd"
version = "0.0.0"
description = "RLM behavior via on-policy self-distillation; reference-compatible harness"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bitsandbytes==0.49.0",
    "accelerate==1.13.0",
    "psutil==7.2.2",
    "PyYAML==6.0.3",
    "rlms @ git+https://github.com/alexzhang13/rlm.git@d04208afbad29ca675ab13478c40ee8bebc84bfe",
    "rlm-train @ git+https://github.com/alexzhang13/rlm.git@d04208afbad29ca675ab13478c40ee8bebc84bfe#subdirectory=training",
    "verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@58b119fa1b24eff85b74a75ccf3e132523b3c6c3",
    # Commit archives avoid fetching unrelated private/SSH Git submodules.
    "prime-rl @ https://github.com/PrimeIntellect-ai/prime-rl/archive/09e11c7527a242b9f150c7c4c71b1b96da66cb75.tar.gz",
    "prime-rl-configs @ https://github.com/PrimeIntellect-ai/prime-rl/archive/09e11c7527a242b9f150c7c4c71b1b96da66cb75.tar.gz#subdirectory=packages/prime-rl-configs",
]

[dependency-groups]
test = ["pytest==9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
override-dependencies = [
    "renderers @ git+https://github.com/PrimeIntellect-ai/renderers.git@8704f9d50252692a4a677177eb98d274f8d3ac5d",
    "pydantic-config @ git+https://github.com/samsja/pydantic_config.git@73c1d84f7c359fa5fa3b7cfb946272352866efb7",
]
